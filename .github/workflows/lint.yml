# The repository's lint checks, the tests of those checks, and ruff, on every pull request and on
# every push to beta and main. Nothing is built, so it runs in about a minute.
name: lint

on:
  pull_request:
  push:
    branches: [beta, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pytest and ruff
        run: python -m pip install pytest==9.1.1 ruff==0.16.10
      - name: Repository checks (scripts/lint)
        run: python scripts/lint/run_checks.py
      - name: Tests of the checks
        run: python -m pytest -q -p no:cacheprovider scripts/lint/tests
      - name: ruff check
        run: ruff check --no-cache .
