# Keep the GitHub Actions the workflows use up to date: one pull request a month, into beta, with all
# updates grouped. The workflows pin each action to a commit; Dependabot updates the commit and the
# version comment beside it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: beta
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope
    groups:
      actions:
        patterns: ["*"]
