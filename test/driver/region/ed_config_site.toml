# SPDX-License-Identifier: Apache-2.0
# The config test_region derives its region and site configs from: one deciduous PFT, fast
# biophysics on. The test gives every run the rest (test/driver/test_region.f90, common_block,
# region_block and site_block): the window, a bare-ground start, the synthetic ED_ERA5land archive and
# its soil maps, the location, the output's place and names; and each case adds its own keys.
# derive_config writes each key once, so a key set here and by the test is the test's.
# test/CMakeLists.txt runs the test in this folder.
[run]
dt_slow    = "1d"

[fast]
fast_biophysics_on  = true
dt_fast             = "900s"
time_integrator     = "esdirk2"
rtol                = 2.0e-3

[demography]
demography_on             = true
recruitment_on            = true
cohort_fusion_on          = true
patch_disturbance_on      = true
patch_fusion_on           = true
max_cohort                = 60
n_cohort_fusion_iter      = 6
cohort_size_tol_min       = 0.02
cohort_size_tol_max       = 0.10
cohort_lai_cap            = 1.0
min_cohort_agb            = 1.0e-6
negligible_nplant         = 1.0e-8
split_eps                 = 1.0e-4
cohort_fission_on         = true
n_height_layers           = 16
max_patch                 = 12
n_patch_fusion_iter       = 6
patch_light_tol           = 0.10
patch_light_tol_max       = 0.15
patch_light_maxdev_factor = 1.5
min_patch_area            = 1.0e-4
conservation_tol          = 0.001
growth_memory_days        = 90.0
patch_disturbance_rate    = 0.014
disturbance_survive_height = 10.0
min_recruit_size          = 1.0e-2

[init]
pft_config   = "pft_parameters.toml"

[output]
enabled       = true
io_config     = "output_variables.toml"
cohort_max    = 4096
patch_max     = 256
sync_every    = "flush"
fast_interval_steps = 4
[output.fast]
enabled    = true
file_chunk = "day"
[output.daily]
enabled    = true
file_chunk = "month"
[output.annual]
enabled    = false
file_chunk = "run"

[leaf_physiology]
stomatal_model     = "medlyn"
temp_response_form = "peaked"
colimitation       = "quadratic"
use_boundary_layer = false
kc25    = 40.49
ko25    = 27840.0
gstar25 = 4.275
ea_kc     = 79430.0
ea_ko     = 36380.0
ea_gstar  = 37830.0
ea_vcmax  = 65330.0
ea_jmax   = 43540.0
ea_rd     = 46390.0
hd_vcmax  = 200000.0
hd_jmax   = 200000.0
hd_rd     = 200000.0
ds_vcmax  = 650.0
ds_jmax   = 640.0
ds_rd     = 490.0
o2_mol_frac      = 0.209
leaf_absorptance = 0.85
phi_psii         = 0.85

[site]
apply_elevation_lapse = true
lapse_rate_tair       = 0.0065

[forcing]
forcing_on     = true
tq_height            = 2.0
wind_height          = 10.0
height_above         = "zero_plane"
wind_exposure        = "open_terrain"
wind_exposure_z0     = 0.03
wind_blending_height = 40.0
timestep       = "3600s"
avg_convention = "end"
sw_partition   = "clearidx"
lwdown_source  = "file"
co2_const      = 420.0
start_clamp    = "hold"

[soil_carbon]
soil_carbon_on = true

[soil]
thermal_bottom_bc = "dirichlet"
