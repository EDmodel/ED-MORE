# Optional: run the repository's checks at every commit (https://pre-commit.com). Set it up once in
# your clone with
#   pip install pre-commit
#   pre-commit install
# CI runs the same checks on every pull request; the hook only tells you sooner.
repos:
  - repo: local
    hooks:
      - id: lint
        name: repository checks (scripts/lint)
        entry: python3 scripts/lint/run_checks.py
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff
        name: ruff check
        entry: ruff check
        language: python
        additional_dependencies: ["ruff==0.16.10"]
        types: [python]
