# ED-MORE output selection -- GENERATED by `edmore --dump-io-config`.
#
# Point the main config at a file like this with [output].io_config = "ed_io_config.toml".
# A line names a variable, or a pattern of names with * (quoted: "mean_*_py"), and what is
# written:
#   name = "F D M Y" -> at these tiers: F sub-daily, D daily, M monthly, Y yearly
#   name = true      -> at its default tiers, below
#   name = false     -> nowhere
# A variable takes the most specific line that matches it: its own name over any pattern, a
# pattern with more literal characters over one with fewer; with none, its default. A name
# may ask only for the tiers it can be on (below; a cohort or patch variable is never on Y);
# a pattern gives each of its variables the tiers it asks that the variable can be on. Two
# lines as specific as each other that disagree, a line that matches nothing, a tier none
# of a line's variables can be on, and `true` for a name off by default stop the run. A tier
# whose [output.<tier>].enabled is false writes nothing, whatever this file says.
#
# Each line below: the default (false: off), the tiers it can be on, [axis], long name (units).
# Every line is commented out, so this file as generated changes nothing.

[variables]

