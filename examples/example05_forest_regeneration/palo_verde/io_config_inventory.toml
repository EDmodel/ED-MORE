# Output of ed_config_inventory.toml: daily (D) and monthly (M) cohort records for the leaf habits and the
# carbon budget, PFT and site totals also yearly (Y); hourly (F) leaf potential.
[variables]
"*_pa"                      = false     # no per-patch record
nplant_co                   = "D M"
mean_dbh_co                 = "D M"
mean_height_co              = "F D M"
mean_lai_co                 = "D M"
pft_co                      = "D M"
mean_leaf_carbon_co         = "D M"
mean_storage_carbon_co      = "D M"
mean_leaf_flush_tendency_co = "D M"
mean_leaf_shed_tendency_co  = "D M"
mean_dmax_psi_leaf_co       = "D M"
mean_psi_wood_co            = "D M"
mean_mort_rate_co           = "D M"
mean_gpp_co                 = "F D M"
mean_npp_co                 = "D M"
mean_beta_stomata_co        = "D M"
mean_nplant_pft_py          = "D M Y"
mean_lai_pft_py             = "D M Y"
mean_agb_pft_py             = "D M Y"
mean_basal_area_pft_py      = "D M Y"
mean_gpp_pft_py             = "D M Y"
mean_npp_pft_py             = "D M Y"
mean_lai_py                 = "D M Y"
mean_leaf_carbon_py         = "D M Y"
mean_storage_carbon_py      = "D M Y"
mean_gpp_py                 = "F D M Y"
mean_et_py                  = "D M Y"
mean_soil_water_layer_si    = "F D M Y"
mean_soil_psi_layer_si      = "D M Y"
mean_litter_leaf_py         = "D M Y"
mean_mort_rate_py           = "D M Y"
mean_leaf_water_co          = "D M"
mean_wood_water_co          = "D M"
mean_sapflow_co             = "D M"
mean_leaf_transp_co         = "D M"
mean_psi_leaf_co            = "F D M"
mean_plc_co                 = "D M"
mean_anet_co                = "D M"
mean_rd_co                  = "D M"
