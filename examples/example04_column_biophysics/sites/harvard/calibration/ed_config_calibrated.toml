# CALIBRATED by scripts/calibrate_fast from ed_config_eval.toml.
# Every line is the base file's, comments included, except these keys the fit set
# (calibrated value, the base file's value; EFFECTIVE: its value belongs to this model structure;
# KATTGE & KNORR: fixed at the growth temperature's value, not fitted):
#   aerodynamics.z0m_ratio         0.0580716  (0.13)  EFFECTIVE
#   leaf_physiology.ds_vcmax       648.076  (650)  KATTGE & KNORR
#   leaf_physiology.ds_jmax        645.462  (640)  KATTGE & KNORR
# and these settings of the calibration (calibration.toml [overrides], the variant, [calibrated]):
#   init.pft_config                "calibration/pft_parameters_calibrated.toml"
#   output.prefix                  "cal"
# ED-MORE example 04, the Harvard Forest site: NEON's HARV tower over six years, 2019-01-02 to 2025-01-01
# UTC, started from census 2 of the ForestGEO plot around the tower, with hourly output to compare with
# the tower's fluxes. As at BCI there is no spin-up: the stand is the census (harvard_census.toml ->
# scripts/prepare_input/census), the soil starts at the tower's January temperature, and soil carbon
# starts in steady state with the stand's litter. Every output stamp is UTC.

[run]
dt_slow    = "1d"
start_time = "2019-01-02"      # the forcing's first record is 2019-01-01 05:00 UTC (midnight EST)
end_time   = "2025-01-01"
n_threads  = 8

[fast]
fast_biophysics_on  = true
dt_fast             = "900s"
time_integrator     = "esdirk2"
rtol                = 2.0e-3
canopy_water_on     = true

[demography]
# The stand is frozen at the census: no growth, mortality or restructuring, while the leaves follow
# the season (docs/science/demography.md §7). The keys below build the starting stand from the census.
demography_on             = false
recruitment_on            = true
cohort_fusion_on          = true
patch_disturbance_on      = true
patch_fusion_on           = true
max_cohort                = 60
n_cohort_fusion_iter      = 6
cohort_size_tol_min       = 0.02
cohort_size_tol_max       = 0.10
cohort_lai_cap            = 1.0
min_cohort_carbon         = 1.0e-6
negligible_nplant         = 1.0e-8
split_eps                 = 1.0e-4
cohort_fission_on         = true
n_height_layers           = 16
max_patch                 = 60
n_patch_fusion_iter       = 6
patch_light_tol           = 0.04    # as BCI's: the census's gaps stay apart from the closed forest
patch_light_tol_max       = 0.08
patch_light_maxdev_factor = 1.5
min_patch_area            = 1.0e-4
conservation_tol          = 0.001
growth_memory_days        = 365.0
patch_disturbance_rate    = 0.014
disturbance_survive_height = 10.0
min_recruit_size          = 1.0e-2

[init]
init_mode    = 1                  # a census: one patch per 20 m cell, fused by ED-MORE before the first step
census_file  = "data/harvard_census2019_ed.csv"   # run_site.py builds it from harvard_census.toml
pft_config   = "calibration/pft_parameters_calibrated.toml"
soil_temp    = 275.5              # [K] the tower's soil at 2-26 cm, 1-3 January 2019 (1.3-3.0 degC)
soil_theta   = 0.30               # [m3/m3] winter-wet: the tower measured 0.35-0.37 at 7 and 27 cm

[output]
state_write       = false
state_interval    = "6 years"
state_file_dir    = "output"
state_file_prefix = "eval"
enabled       = true
dir           = "output"
prefix        = "cal"
overwrite     = true
io_config     = "output_variables.toml"
cohort_max    = 4096
patch_max     = 256
sync_every    = "flush"
fast_interval_steps = 4                # 4 * dt_fast (900 s) = hourly records

[output.fast]
enabled    = true
file_chunk = "year"

[output.daily]
enabled    = true
file_chunk = "all"

[output.monthly]
enabled    = false
file_chunk = "year"

[output.annual]
enabled    = false
file_chunk = "all"

[trait_dynamics]
trait_plasticity_on = true

[leaf_physiology]
stomatal_model     = "medlyn"
temp_response_form = "peaked"
colimitation       = "quadratic"
use_boundary_layer = false
kc25    = 40.49
ko25    = 27840.0
gstar25 = 4.275
ea_kc     = 79430.0
ea_ko     = 36380.0
ea_gstar  = 37830.0
ea_vcmax  = 65330.0
ea_jmax   = 43540.0
ea_rd     = 46390.0
hd_vcmax  = 200000.0
hd_jmax   = 200000.0
hd_rd     = 200000.0
ds_vcmax  = 648.076
ds_jmax   = 645.462
ds_rd     = 490.0
o2_mol_frac      = 0.209
leaf_absorptance = 0.85
phi_psii         = 0.74

[site]
latitude              = 42.53691      # NEON's HARV tower
longitude             = -72.17265
elevation             = 351.0
apply_elevation_lapse = false         # the tower measures at the site

[forcing]
forcing_on     = true
format         = "default"
path           = "data/harvard_forcing.nc"         # run_site.py builds it (make_tower_forcing.py)
grid_index     = 1
grid_match     = "explicit"
tq_height      = 38.5              # the tower's own heights, above the ground at its base (harvard_site.toml)
wind_height    = 39.2
height_above   = "ground"
wind_exposure  = "local"
timestep       = "1800s"
avg_convention = "begin"
sw_partition   = "clearidx"
lwdown_source  = "file"
# The repository's CO2 file ends in 2022 and ED-MORE does not extrapolate it: the run holds NOAA's global
# mean of 2019-2024 (the annual means rise from 412 to 425).
co2_source     = "const"
co2_const      = 418.0
recycle        = false             # the six tower years cover the run
start_clamp    = "error"

[soil_carbon]
soil_carbon_on = true
# Steady state with the census stand's litter (make_census.py's summary): leaf fall and fine-root
# turnover from the PFTs, wood from the stand's biomass mortality of 0.82 %/yr (censuses 1 and 2).
spinup_steady      = true
spinup_labile_grnd = 2.351972e-04     # [kgC/m2/day]
spinup_labile_soil = 5.036570e-04
spinup_struct_grnd = 4.190357e-04
spinup_struct_soil = 3.889388e-04

# Harvard's soil at NEON's megapit: a stony sandy loam over sandy till, with an organic-rich top, above a
# dense till at 113 cm. One curve for the column: each horizon's from its texture by the model's own
# formulas, thickness-weighted (harvard_traits.py). The column is 1.5 m deep: the mineral soil above the
# till and 0.4 m of the till's top, the water the trees draw on in a dry August. In 2022's drought a
# 1.09 m column dries to its residual water and its LE falls to 82 W m-2 against the tower's 117 over
# 15-28 August; at 1.5 m it is 116, and its top 15 cm keep 0.11 m3/m3 on 28 August (HF006's TDR found
# 0.06-0.07 in dry summers). The base is free-draining.
[soil]
depth       = 1.5                # [m] the megapit's 4-113 cm above the dense till, and the till's top
theta_sat   = 0.422              # [m3/m3]
theta_res   = 0.079              # [m3/m3]
curve_par_a = 3.26               # [1/m]  van Genuchten alpha
curve_par_n = 1.553              # [-]    van Genuchten n
ksat        = 1.35e-5            # [m/s]
thermal_bottom_bc = "dirichlet"
deep_temp  = 282.15              # [K] the tower's mean air temperature, 2019-2024 (its soil at 46 cm: 282.3)
deep_depth = 2.645               # [m] the bottom node (1.25 m) + 1.973 / sqrt(2), the default's rule

[aerodynamics]
z0m_ratio = 0.0580716   # set by calibrate_fast
