# Every line is the base file's, comments included, except these keys the fit set
# (calibrated value, the base file's value; EFFECTIVE: its value belongs to this model structure;
# KATTGE & KNORR: fixed at the growth temperature's value, not fitted):
#   pft.vcmax25                    13.8019  (68.9)
#   pft.vcmax25 (PFT 2)            61.6996  (61.7)
#   pft.vcmax25 (PFT 3)            16.3047  (78)
#   pft.capacity_low_temp          282.397  (277.864)  EFFECTIVE
#   pft.capacity_low_temp (PFT 2)  274.274  (277.864)  EFFECTIVE
#   pft.capacity_low_temp (PFT 3)  286.145  (277.864)  EFFECTIVE
#   pft.stomatal_g1                1.07958  (2.22)
#   pft.stomatal_g1 (PFT 2)        12.5094  (2.22)
#   pft.stomatal_g1 (PFT 3)        0.973744  (2.22)
#   pft.stomatal_g0 (PFT 2)        0.0295893  (0.01)
#   pft.jmax_vcmax_ratio           2.28212  (2.33)  KATTGE & KNORR
#   pft.jmax_vcmax_ratio (PFT 2)   2.28212  (2.53)  KATTGE & KNORR
#   pft.jmax_vcmax_ratio (PFT 3)   2.28212  (2.53)  KATTGE & KNORR
# The Toolik site's three PFTs in moist acidic tussock tundra: 1 the tussock sedge (Eriophorum vaginatum,
# Carex bigelowii), a grass with no stem; 2 the evergreen dwarf shrubs (Rhododendron tomentosum = Ledum
# palustre, Vaccinium vitis-idaea, Empetrum nigrum, Cassiope tetragona); 3 the deciduous dwarf shrubs
# (Betula nana, Salix pulchra, Vaccinium uliginosum). Forbs are left out. Every key is the repository PFT
# file's (ed_config_pft.toml), at its default unless a comment gives the source. A grass takes a value for
# the stem's keys that it does not use. Toolik's measured leaf traits: MAT = the moist acidic tussock tundra
# at Toolik Lake.
#
# Sources cited by tag:
#   S18  Schedlbauer et al. 2018, Ecol. Evol. 8:3711-3725, doi:10.1002/ece3.3939 (Toolik-ecotype E. vaginatum)
#   vW13 van de Weg, Shaver & Salmon 2013, Plant Ecol. 214:1273-1286, doi:10.1007/s11258-013-0250-6 (MAT)
#   IG20 Iturrate-Garcia et al. 2020, Biogeosciences 17:4981-4998, doi:10.5194/bg-17-4981-2020 (NE Siberian tundra)
#   R17  Rogers et al. 2017, New Phytol. 216:1090-1103, doi:10.1111/nph.14740 (Arctic Alaska)
#   L15  Lin et al. 2015, Nature Clim. Change 5:459-464, doi:10.1038/nclimate2550
#   CLM5 the CLM5.0 parameter file (clm5_params.c171117.nc) and Technical Note (Lawrence et al. 2018):
#        broadleaf evergreen shrub, broadleaf deciduous boreal shrub, C3 arctic grass
#   CLM45 the CLM4.5 Technical Note (Oleson et al. 2013, NCAR/TN-503+STR), Table 8.1
#   B15  Berner et al. 2015, For. Ecol. Manage. 337:110-118, doi:10.1016/j.foreco.2014.10.027, Appendix A
#        (harvested shrubs: dwarf birch and willows in tundra and boreal forest)
#   WB91 Walker & Barry 1991, Toolik Lake vegetation plots (ORNL DAAC 1333, doi:10.3334/ORNLDAAC/1333):
#        the mean shrub height of its six tussock-tundra plots
#   TTT  the Tundra Trait Team database (Bjorkman et al. 2018, Global Ecol. Biogeogr. 27:1402,
#        doi:10.1111/geb.12821): the plants' heights north of 60 N
#   C96  Chapin et al. 1996, J. Veg. Sci. 7:347-358, Alaska's maximum rooting depths (Iversen et al. 2015,
#        New Phytol. 205:34-58, Table 1)
#   S14  Shaver et al. 2014, in Hobbie & Kling (eds), Alaska's Changing Arctic, Oxford UP, Table 5.1 (MAT)
#   M06  the ARC LTER MAT06 control plots' harvest, 2012 (knb-lter-arc.20158.2), make_toolik_census.py
#   GWDD the Global Wood Density Database (Zanne et al. 2009)

[pft]
growth_form        = ["grass", "tree", "tree"]
wood_density       = [0.538, 0.62, 0.538]   # [g/cm3] GWDD: the deciduous shrubs Betula's genus mean (B. nana is
                                            #   88 % of their leaves in M06), the evergreens the Ericaceae's family
                                            #   mean (no Rhododendron tomentosum, Vaccinium, Empetrum or Cassiope is
                                            #   listed); the grass has no wood
# The mortality hazard and the conductivity below from wood density, the plasticity from vcmax25
# (scripts/prepare_input/pft_traits); the stand is frozen, so the hazard only sets the shrubs' wood litter
# for the soil carbon's spin-up.
mort_gamma         = [0.011488117580213618, 0.008849868915833468, 0.011488117580213618]   # [1/yr]
mort_alpha         = [0.05667756282099476, 0.04815079562819573, 0.05667756282099476]      # [1/yr]
mort_beta          = [18.15851907855689, 18.89216695968993, 18.15851907855689]            # [yr/cm]
leaf_width         = [0.001, 0.005, 0.01]   # [m] E. vaginatum's filiform blades, about 1 mm; the evergreens'
                                            #   narrow leaves (Ledum's 2-5 mm, V. vitis-idaea's 5-10 mm); B. nana's
                                            #   round blades, about 1 cm (the species' descriptions, Flora of North
                                            #   America)
branch_diameter    = [0.005, 0.005, 0.005]  # [m] a dwarf shrub's twigs: its stems are 0.1-2.5 cm at the ground (B15)
reproduction_investment_fraction = [0.3, 0.3, 0.3]
recruit_carbon_efficiency          = [1.0e-3, 1.0e-3, 1.0e-3]
seed_rain_recruits = [0.01, 0.01, 0.01]     # [plant/m2/yr]
include_pft        = [1, 1, 1]
min_recruit_height = 0.05                   # [m] below every PFT's height
min_repro_height   = [0.146, 0.08, 0.20]    # [m] each PFT's height: the stand is frozen
photosynthetic_pathway = [1, 1, 1]
vcmax25            = [13.8019, 61.6996, 16.3047]     # [umol/m2/s] the sedge: Toolik-ecotype E. vaginatum, 68.9 (S18, Table 4);
                                            #   the evergreens: no measurement was found, CLM4.5's broadleaf evergreen
                                            #   shrub (CLM45); the deciduous shrubs: B. nana in MAT, about 50 at 20 C
                                            #   (vW13, Fig. 3, read off the figure), at 25 C on ea_vcmax
jmax_vcmax_ratio   = [2.28212, 2.28212, 2.28212]     # the sedge: S18's 160.3 / 68.9; the shrubs: Arctic Alaska's species mean
                                            #   (R17, 2.53 at 25 C)
tpu_vcmax_ratio    = [0.167, 0.167, 0.167]
rd_vcmax_ratio     = [0.015, 0.015, 0.015]
kp25               = [1.0e-9, 1.0e-9, 1.0e-9]
stomatal_g0        = [0.01, 0.0295893, 0.01]
stomatal_g1        = [1.07958, 12.5094, 0.973744]     # Medlyn [kPa^0.5]: the Arctic's (L15, Fig. 2: 162 measurements in
                                            #   Arctic Alaska); the calibration fits each PFT's
stomatal_d0        = [1500.0, 1500.0, 1500.0]
quantum_yield_c4   = [0.0, 0.0, 0.0]
theta_j            = [0.70, 0.70, 0.70]
capacity_low_temp       = [282.397, 274.274, 286.145]   # [K]
capacity_low_temp_slope = [0.4, 0.4, 0.4]                  # [1/K]
theta_cj_c3        = [0.98, 0.98, 0.98]
theta_ip_c3        = [0.95, 0.95, 0.95]
theta_cj_c4        = [0.80, 0.80, 0.80]
theta_ic_c4        = [0.95, 0.95, 0.95]
katul_lambda25     = [800.0, 800.0, 800.0]
wstress_lambda_exp = [1.0, 1.0, 1.0]
wstress_sref_stomata = [2.0, 2.0, 2.0]      # [1/MPa]
sla                = [19.15, 11.36, 24.7]   # [m2/kgC] at a carbon fraction of 0.5: the sedge, 95.74 cm2/g (S18,
                                            #   Table 3); the evergreens, R. tomentosum's 54.6 and V. vitis-idaea's 59.5
                                            #   (IG20, Table 2), weighted by their leaves in M06; the deciduous shrubs,
                                            #   B. nana's mass per area in MAT, about 81 g/m2 (vW13, Fig. 4, read off the
                                            #   figure)
root_to_leaf_ratio = [2.8, 9.9, 9.9]        # M06's fine roots over leaves (make_toolik_census.py, 7.): the sedge,
                                            #   the graminoids' 122 +- 36 g/m2 (Carex bigelowii 92, Eriophorum
                                            #   vaginatum 28) over their blades, 43 g/m2; the shrubs, the other
                                            #   plants' 743 +- 88 g/m2 over the shrubs' leaves, 75 g/m2
