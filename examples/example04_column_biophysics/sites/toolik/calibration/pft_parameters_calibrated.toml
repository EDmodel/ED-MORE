[allometry]
# The shrubs: the dwarf birch harvested by B15, the stem's diameter D [cm] at the ground (diameter_height =
# 0), for both shrub PFTs, since no evergreen dwarf shrub was harvested. make_toolik_census.py fits them in
# log-log on B15's 52 birch:
#   - the height, 62.66 D^0.850 cm (the 25 with a height, R2 0.87);
#   - the stem's above-ground carbon, its wood (stem and branch), 25.86 D^2.915 g (R2 0.97), at 0.5 gC per g;
#   - the leaf area, following the new growth (leaves and new twigs), 4.82 D^2.413 g (R2 0.95).
# The stem's silhouette, its diameter times its height, is its wood area, and the stem is all sapwood. The
# deciduous shrubs stand at the shrub height of the site's tussock tundra, 20 cm (WB91, the median of six
# plots), so D = 0.26 cm; there the birch's new growth is 0.37 of its wood, as M06's deciduous new leaves
# and stems are 0.40 of their old stems. The evergreens stand at Ledum palustre's median height, 8 cm
# (TTT), so D = 0.089 cm. Each caps at its 90th percentile: the deciduous at the tallest of WB91's plots,
# 30 cm, the evergreens at Ledum's 15.3 cm (TTT). A grass's height is its hgt_max: the sedge stands at E.
# vaginatum's median, 14.6 cm (TTT). make_toolik_census.py prints the values below and the leaf area each
# cohort holds.
height_allometry = "power"
hgt_max    = [0.146, 0.153, 0.30]      # [m]
diameter_height = [1.3, 0.0, 0.0]     # [m] the shrubs' stems at the ground (B15); a grass ignores it
b1Ht       = -0.467496
b2Ht       = 0.850116
agb_c1     = [0.034008, 0.034008, 0.039318]
agb_c2     = 1.02269
lai_b1     = [0.000247973, 0.040885, 0.06774]   # the sedge's per tiller [m2]; each shrub cohort's its leaf area
lai_b2     = [0.0, 0.846727, 0.846727]
wai_b1     = [0.0, 0.0008, 0.002]      # [m2 per cm of diameter] 0.01 m/cm times the cohort's height
wai_b2     = [1.0, 1.0, 1.0]
sapwood_area_b1  = [0.7853982, 0.7853982, 0.7853982]   # [cm2/cm^2] pi/4: the stem is all sapwood
sapwood_area_b2  = [2.0, 2.0, 2.0]
aboveground_frac = [0.7, 0.262, 0.241]  # the shrubs' stems above the ground over all their stems in M06:
                                        #   101.5 / 388.1 and 40.1 / 166.1 g/m2
crown_base_fraction = [0.02, 0.2, 0.2]  # [-] the crown's base over its top: CLM5's canopy bottom over top, 0.01 /
                                        #   0.5 m for the arctic grass and 0.1 / 0.5 m for the shrubs

[hydraulics]
leaf_pi0             = -1.5
leaf_elastic_mod     = 12.0
leaf_apoplast_frac   = 0.3
leaf_water_sat       = 2.0
wood_pi0             = -1.0
wood_elastic_mod     = 8.0
wood_apoplast_frac   = 0.2
wood_water_sat       = 1.0
wood_psi50           = -2.0
wood_kexp            = 2.0
wood_kmax            = [3.8057382746650967, 3.1117958398413266, 3.8057382746650967]   # [kg/m/s/MPa] pft_traits.py
leaf_kmax            = [10.5, 10.5, 10.5]   # [mmol/m2/s/MPa]
# The roots, to the maximum rooting depths of Alaska's species (C96): E. vaginatum's 40 cm, R. tomentosum's
# 20 and V. vitis-idaea's 10 weighted by their leaves in M06, B. nana's 20 and V. uliginosum's 15 likewise,
# less the 6 cm of moss above the soil column; within it, Jackson et al. (1996)'s tundra profile as CLM5 takes
# it, 1 - beta^d with d in cm (beta 0.914 for the arctic grass and the deciduous shrub, 0.964 for the evergreen
# shrub), whose root_beta is beta to the rooting depth in cm.
root_beta            = [0.0470, 0.7059, 0.2840]
root_depth_b1        = [0.34, 0.095, 0.14]   # [m] with root_depth_b2 = 0, each PFT's rooting depth
root_depth_b2        = [0.0, 0.0, 0.0]
specific_root_length = 20000.0
fine_root_radius     = 0.00025

# Leaf phenology (docs/science/plant_phenology.md): every PFT flushes on warmth and long days and sheds on cold
# and short days, as Harvard's broadleaves do (example 02, part 2), fitted in example 02, part 4
# (toolik_stand/phenology.toml) to NEON's tagged plants at TOOL and the tower camera, 2019-2024: for the sedge and
# the deciduous shrubs, the warmth and the day length that flush them and how fast, and the cold, the day length
# and the rate that end their season; for the evergreens, the warmth that breaks their buds and how fast the
# shoots fill. The flush runs until the hours of light fall below about 21 (early August); the cold the shed
# needs is summed below about 20 C, every day at Toolik, so it counts the days from midsummer. The evergreens
# keep half their leaves through the winter: R. tomentosum's leaves live about two years (Shaver 1981, Oecologia
# 49:362), their shed not fitted; the sedge keeps a tenth green, as NEON's graminoids are at the season's end.
[phenology]
flush_cue_mask        = [3, 3, 3]
shed_cue_mask         = [3, 3, 3]
flush_cue_timescale   = [5.0, 5.0, 5.0]
shed_cue_timescale    = [5.0, 5.0, 5.0]
flush_rate_max        = [0.045773, 0.263052, 0.055505]
shed_rate_max         = [0.240605, 0.05, 0.318429]
min_leaf_cover        = [0.1, 0.5, 0.0]
bare_leaf_cover       = [0.02, 0.02, 0.02]
flush_base_temp       = [278.15, 278.15, 278.15]
flush_degree_days     = [8.3169, 109.29, 5.891]
flush_temp_sharpness  = [0.04, 0.04, 0.04]
shed_base_temp        = [292.82, 283.15, 293.09]
shed_degree_days      = [391.55, 123.0, 460.22]
shed_temp_sharpness   = [0.1, 0.1, 0.1]
par_min               = [2.0, 2.0, 2.0]
flush_light_hours     = [21.388, 16.0, 21.437]
flush_light_sharpness = [4.0, 4.0, 4.0]
shed_light_hours      = [17.545, 16.0, 20.425]
shed_light_sharpness  = [-1.0, -1.0, -1.0]
light_window          = [10.0, 10.0, 10.0]
