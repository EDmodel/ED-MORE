wood_clumping      = [0.50, 0.50, 0.50]
leaf_angle_mean    = [63.24, 57.3, 57.3]    # [deg] the sedge: de Wit's (1965) erectophile distribution (CLM5's xl
                                            #   -0.30); the shrubs: the spherical distribution (CLM5's xl 0.01, 0.25)
leaf_angle_std     = [18.5, 21.6, 21.6]     # [deg] those distributions' spreads
